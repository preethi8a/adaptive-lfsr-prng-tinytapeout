# Tiny Tapeout project information

project:
  title: "Self-Seeding Adaptive 16-bit Galois LFSR PRNG"
  author: "Preethi S A" "Khushi Vishwanath"
  discord: ""
  description: "A compact 16-bit Galois LFSR pseudo-random number generator with deterministic self-seeding and automatic polynomial adaptation."
  language: "Verilog"
  clock_hz: 50000000

# Single-tile design
tiles: "1x1"

# Top-level Tiny Tapeout module
top_module: "tt_um_preethi8a_adaptive_lfsr_prng"

# Source files
source_files:
  - "project.v"
  - "adaptive_lfsr_prng.v"
  - "lfsr16.v"
  - "repetition_monitor.v"
  - "adaptive_controller.v"
  - "seed_generator.v"

# Pinout
pinout:

  # Inputs: 8-bit external seed
  ui[0]: "Seed bit 0"
  ui[1]: "Seed bit 1"
  ui[2]: "Seed bit 2"
  ui[3]: "Seed bit 3"
  ui[4]: "Seed bit 4"
  ui[5]: "Seed bit 5"
  ui[6]: "Seed bit 6"
  ui[7]: "Seed bit 7"

  # Outputs: 8-bit pseudo-random output
  uo[0]: "Random output bit 0"
  uo[1]: "Random output bit 1"
  uo[2]: "Random output bit 2"
  uo[3]: "Random output bit 3"
  uo[4]: "Random output bit 4"
  uo[5]: "Random output bit 5"
  uo[6]: "Random output bit 6"
  uo[7]: "Random output bit 7"

  # Bidirectional pins unused
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
